version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: comunidade-mysql
    environment:
      MYSQL_DATABASE: db_comunidade
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: developer
      MYSQL_PASSWORD: developer
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - comunidade_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  comunidade_mysql_data:
