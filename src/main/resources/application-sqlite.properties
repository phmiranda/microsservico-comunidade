spring.datasource.url=${DATABASE_URL:jdbc:sqlite:./data/comunidade.sqlite}
spring.datasource.driverClassName=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

spring.jpa.database-platform=br.com.phmiranda.comunidade.config.sqlite.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false

spring.flyway.enabled=false
spring.datasource.initialization-mode=always
spring.datasource.schema=classpath:schema-sqlite.sql
spring.datasource.data=classpath:empty-data.sql
spring.datasource.continue-on-error=false
