application.title=@project.artifactId@
application.version=@project.version@

spring.profiles.active=${SPRING_PROFILES_ACTIVE:sqlite}

server.servlet.context-path=/api/comunidade
server.port=${SERVER_PORT:9000}

api.sso.keycloak.url=${KEYCLOAK_URL:https://api.sso.dsv.dominio.com.br}
api.sso.keycloak.realm=${KEYCLOAK_REALM:developer}
api.sso.keycloak.client.id=${KEYCLOAK_CLIENT_ID:backend-comunidade}
api.sso.keycloak.client.secret=${KEYCLOAK_CLIENT_SECRET:}

comunidade.jwt.secret=${JWT_SECRET:local-dev-secret}
comunidade.jwt.expiration=${JWT_EXPIRATION:86400000}
comunidade.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.flyway.enabled=${FLYWAY_ENABLED:false}
