application.title=comunidade-test
application.version=test

server.servlet.context-path=/api/comunidade
server.port=0

spring.devtools.restart.enabled=false
spring.devtools.add-properties=false

spring.datasource.url=jdbc:h2:mem:db_comunidade;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.show-sql=false
spring.flyway.enabled=false

api.sso.keycloak.url=http://localhost
api.sso.keycloak.realm=test
api.sso.keycloak.client.id=backend-comunidade-test
api.sso.keycloak.client.secret=test

comunidade.jwt.secret=test-secret
comunidade.jwt.expiration=86400000
comunidade.cors.allowed-origins=http://localhost:4200
